# Builds pbidriver and publishes it to PyPI and npm with Trusted Publishing (OIDC):
# no API token is stored anywhere. Runs when a GitHub release is published;
# the PyPI part can also be run by hand from the Actions tab.
#
# npm: the trusted publisher (package pbidriver -> this repository, workflow publish.yml) is set up on
# npmjs.com after the package's first, manual publish. npm expires an unused configuration after two
# days, so add it right before a release.
name: Publish to PyPI and npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pbidriver/
    permissions:
      id-token: write  # lets PyPI verify this workflow; no password or token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/pbidriver
    permissions:
      contents: read
      id-token: write  # lets npm verify this workflow; no token needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"  # ships npm 11, which supports trusted publishing
          registry-url: "https://registry.npmjs.org"
      - name: Check the npm and Python versions match
        run: |
          py=$(grep -Po '__version__ = "\K[^"]+' pbidriver/__init__.py)
          js=$(node -p "require('./npm/package.json').version")
          test "$py" = "$js" || { echo "pbidriver/__init__.py says $py but npm/package.json says $js"; exit 1; }
      - name: Publish
        working-directory: npm
        run: |
          cp ../LICENSE LICENSE
          npm publish --access public
