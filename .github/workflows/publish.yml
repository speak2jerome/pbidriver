# Builds pbidriver and publishes it to PyPI and npm with Trusted Publishing (OIDC):
# no API token is stored anywhere. Runs when a GitHub release is published;
# the PyPI part can also be run by hand from the Actions tab.
#
# npm: needs the trusted publisher on npmjs.com (package pbidriver > Settings > Trusted publishing >
# GitHub Actions: owner speak2jerome, repository pbidriver, workflow publish.yml, environment npm, with
# "Allow npm publish" ticked; without it npm only allows staged publishes and answers E403).
# The npm job skips publishing when the version is already on npm, so re-runs stay green.
name: Publish to PyPI and npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pbidriver/
    permissions:
      id-token: write  # lets PyPI verify this workflow; no password or token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/pbidriver
    permissions:
      contents: read
      id-token: write  # lets npm verify this workflow; no token needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Use an npm that supports trusted publishing (11.5.1 or later)
        run: npm install -g npm@^11.5.1 && npm --version
      - name: Check the npm and Python versions match
        id: version
        run: |
          py=$(grep -Po '__version__ = "\K[^"]+' pbidriver/__init__.py)
          js=$(node -p "require('./npm/package.json').version")
          test "$py" = "$js" || { echo "pbidriver/__init__.py says $py but npm/package.json says $js"; exit 1; }
          echo "version=$js" >> "$GITHUB_OUTPUT"
      - name: Skip if this version is already on npm (re-runs, or a manual publish)
        id: exists
        run: |
          if npm view "pbidriver@${{ steps.version.outputs.version }}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "pbidriver@${{ steps.version.outputs.version }} is already on npm; nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.exists.outputs.published != 'true'
        working-directory: npm
        run: |
          cp ../LICENSE LICENSE
          npm publish --access public || {
            echo "::error::npm refused the publish. 'E404 Not Found - PUT' means npm has no trusted publisher for this"
            echo "::error::workflow: npmjs.com > pbidriver > Settings > Trusted publishing > GitHub Actions, with"
            echo "::error::owner speak2jerome, repository pbidriver, workflow publish.yml, environment npm."
            echo "::error::'E403 OIDC permission denied' means that trusted publisher lacks 'Allow npm publish'."
            exit 1
          }
