# Offline tests on every push and pull request: the Python suite on Windows for each supported Python
# version (the versions listed in pyproject.toml's classifiers), and the npm wrapper's tests.
# Nothing here needs Power BI Desktop; scripts/e2e_kit.py covers that locally.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          python -m pbidriver --version
          python -m pbidriver guide workflow
          python -m pbidriver locate

  npm:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        working-directory: npm
        run: npm test
