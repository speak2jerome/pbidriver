[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pbidriver"
dynamic = ["version"]
description = "WebDriver for Power BI Desktop: let AI agents see and drive it (screenshots, visual data, dialogs, slicers, DAX, Performance Analyzer)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jerome Eliezer" }]
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.40",
    "psutil>=5.9",
    "pywin32>=306",
    "pillow>=10.0",
]
keywords = ["power bi", "power bi desktop", "screenshot", "ai agents", "webview2", "devtools", "dax", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Office/Business",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/speak2jerome/pbidriver"
Issues = "https://github.com/speak2jerome/pbidriver/issues"
Changelog = "https://github.com/speak2jerome/pbidriver/blob/main/CHANGELOG.md"

[project.scripts]
pbidriver = "pbidriver.cli:main"

[tool.setuptools]
packages = ["pbidriver"]

[tool.setuptools.dynamic]
version = { attr = "pbidriver.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
